<!DOCTYPE html>
<html lang en>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/dd581d5599.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="DiceRollerContainer">
        <h1>Dice Roller Program</h1>
        <label># of dice:</label>
        <input id="numOfDice" type="number" value="1" min="1" max="6">
        <button type="button" onclick="rollDice()">Roll Dice</button>
        <div id="diceResult"></div>
        <div id="diceImages"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
