<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasswordGen</title>
    <link rel="stylesheet" href="passwordStyle.css">
    <script src="https://kit.fontawesome.com/dd581d5599.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <h1>Password Generator</h1><br>
    <form>
        <div id="inputTextContainer">
        <input type="checkbox" id="allowLowercase">
        <label for="allowLowercase">Allow Lowercase</label><br>
        <input type="checkbox" id="allowUppercase">
        <label for="allowUppercase">Allow Uppercase</label><br>
        <input type="checkbox" id="allowSymbols">
        <label for="allowSymbols">Allow Symbols</label><br>
        <input type="checkbox" id="allowNumbers">
        <label for="allowNumbers">Allow Numbers</label><br>
        <label for="length">Enter password length:</label>
        <input type="number" id="length" value="16" min="8" max="30"><br><br>
        </div>

        <button type="button" id="generatePassword">Generate Password</button><br>
    </form>
    <form>
        <div id="passwordPretext"><label>Your password is: </label></div><br>
        <h3 id="password" title="Copy password to clipboard"></h3>
        <p id="popup"></p>
    </form>

    <script src="passwordGen.js"></script>
</body>
