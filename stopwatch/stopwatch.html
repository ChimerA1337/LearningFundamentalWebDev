<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="stopwatch.css">
    <script src="https://kit.fontawesome.com/dd581d5599.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="stopwatchContainer"></div>
        <div id="counter">00:00:00:00</div>
        <div id="buttonContainer">
            <button type="button" id="run" onclick="run()">Run</button>
            <button type="button" id="pause" onclick="pause()">Pause</button>
            <button type="button" id="reset" onclick="reset()">Reset</button>
        </div>
    <script src="stopwatch.js"></script>
</body>
