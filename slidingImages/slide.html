<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="slide.css">
    <script src="https://kit.fontawesome.com/dd581d5599.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <div class="slider">
        <div class="slides">
            <img class="slide" src="kitty1.jpg" alt="Kitty image #1">
            <img class="slide" src="kitty2.jpg" alt="Kitty image #2">
            <img class="slide" src="kitty3.jpg" alt="Kitty image #3">
            <button class="prev" onclick="prevSlide()">&#10094</button>
            <button class="next" onclick="nextSlide()">&#10095</button>
        </div>
    </div>

    <script src="slide.js"></script>
</body>
